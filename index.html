<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Login Form</title>
  </head>
  <body>
    <div class="login-box">
      <h2>Login</h2>
      <form>
        <input type="text" class="user_data" placeholder="Username" required />

          class="user_data"
          placeholder="password"
          required

        <button class="btn">Login</button>
      </form>
    </div>
  </body>
</html>
