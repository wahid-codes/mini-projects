<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Login Form</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f2f2f2;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .login-box {
        background-color: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgb(155, 128, 77);
        width: 300px;
      }

      .login-box h2 {
        color: rgb(213, 169, 86);
        margin-bottom: 20px;
        text-align: center;
      }

      .user_data {
        width: 100%;
        padding: 12px 15px;
        margin: 10px 0;
        border: 1px solid wheat;
        border-radius: 5px;
        box-sizing: border-box;
      }

      .user_data:focus {
        outline: none;
        border: 1px solid rgba(96, 60, 12, 0.408);
      }

      .btn {
        width: 100%;
        padding: 12px;
        background: rgb(211, 169, 93);
        border: none;
        border-radius: 5px;
        color: rgba(0, 0, 0, 0.602);
        font-size: 16px;
        cursor: pointer;
        font-weight: 500;
      }

      .btn:hover {
        background-color: rgb(215, 148, 24);
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h2>Login</h2>
      <form>
        <input type="text" class="user_data" placeholder="Username" required />
        <input
          type="Password"
          class="user_data"
          placeholder="Password"
          required
        />
        <button class="btn">Login</button>
      </form>
    </div>
  </body>
</html>
